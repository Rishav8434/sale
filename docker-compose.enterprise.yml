version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS 3.4 Spatial Engine
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: realnest-x-postgis
    restart: always
    environment:
      POSTGRES_DB: realnest_x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enterprise_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realnest_x"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Alpine (L2 Query Cache, Session Store, Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: realnest-x-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Zookeeper & Apache Kafka (Event-Driven Architecture)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: realnest-x-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: realnest-x-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 4. Elasticsearch 8 (Autocomplete, Geo-Search, Typo-Tolerance)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: realnest-x-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 5. RealNest X Enterprise Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realnest-x-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/realnest_x
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: enterprise_password_2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo-cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-demo-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-demo-secret}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"

  # 6. RealNest X React 19 Frontend with Nginx SPA Routing
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realnest-x-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgis_data:
  redis_data:
  es_data:
