server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: realnest-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# RealNest Custom Application Properties
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo-cloud}
    api-key: ${CLOUDINARY_API_KEY:demo-key}
    api-secret: ${CLOUDINARY_API_SECRET:demo-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
