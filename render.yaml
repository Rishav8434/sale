services:
  # 1. Backend Web Service (Spring Boot 3 + Java 17 Docker)
  - type: web
    name: realnest-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/properties?size=1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: realnest-postgres
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: demo-cloud
      - key: CLOUDINARY_API_KEY
        value: demo-key
      - key: CLOUDINARY_API_SECRET
        value: demo-secret
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. Frontend Static Site (React 19 + Vite)
  - type: web
    name: realnest-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: realnest-backend
          property: host

databases:
  # PostgreSQL Database Instance
  - name: realnest-postgres
    databaseName: realnest
    user: realnest
    plan: free
    region: oregon
