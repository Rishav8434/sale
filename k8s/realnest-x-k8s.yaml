apiVersion: v1
kind: Namespace
metadata:
  name: realnest-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realnest-config
  namespace: realnest-prod
data:
  SPRING_PROFILES_ACTIVE: "prod"
  CORS_ALLOWED_ORIGINS: "https://realnest.io,https://www.realnest.io"
  SPRING_DATA_REDIS_HOST: "redis-cluster.realnest-prod.svc.cluster.local"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.realnest-prod.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realnest-backend
  namespace: realnest-prod
  labels:
    app: realnest-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: realnest-backend
  template:
    metadata:
      labels:
        app: realnest-backend
    spec:
      containers:
        - name: backend
          image: realnest/backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: realnest-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realnest-backend-hpa
  namespace: realnest-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realnest-backend
  minReplicas: 4
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: realnest-backend-service
  namespace: realnest-prod
spec:
  type: ClusterIP
  selector:
    app: realnest-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realnest-frontend
  namespace: realnest-prod
  labels:
    app: realnest-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: realnest-frontend
  template:
    metadata:
      labels:
        app: realnest-frontend
    spec:
      containers:
        - name: frontend
          image: realnest/frontend:v1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: realnest-frontend-service
  namespace: realnest-prod
spec:
  type: ClusterIP
  selector:
    app: realnest-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realnest-ingress
  namespace: realnest-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  tls:
    - hosts:
        - realnest.io
        - api.realnest.io
      secretName: realnest-tls-cert
  rules:
    - host: realnest.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realnest-frontend-service
                port:
                  number: 80
    - host: api.realnest.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realnest-backend-service
                port:
                  number: 8080
