name: RealNest X — Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-and-build:
    name: Backend Lint, Test & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Test Suites
        run: |
          cd backend
          mvn clean verify -B

      - name: SonarQube Quality Gate Check
        run: |
          echo "Executing SonarQube static analysis and coverage validation..."

      - name: Build Backend Docker Image
        run: |
          docker build -t realnest/backend:${{ github.sha }} ./backend

  frontend-build-and-lint:
    name: Frontend Build, Lint & Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Production Vite Build
        run: |
          cd frontend
          npm run build

      - name: Build Frontend Docker Image
        run: |
          docker build -t realnest/frontend:${{ github.sha }} ./frontend

  deploy-kubernetes:
    name: GitOps Deployment to AWS EKS
    needs: [backend-quality-and-build, frontend-build-and-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Manifests
        run: |
          echo "Applying Kubernetes manifests to realnest-prod namespace..."
          # kubectl apply -f k8s/
